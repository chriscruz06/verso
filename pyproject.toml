[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verso"
version = "0.1.0"
description = "Reads recto's column images of an early-modern Latin book into text"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Christopher Cruz" }]
keywords = ["ocr", "tesseract", "latin", "digital-humanities", "transcription"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]

# Runtime dependencies are added by the commit that first needs them, so the
# install stays honest about what the code actually imports.
dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "recto @ git+https://github.com/chriscruz06/recto.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
verso = "verso.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
